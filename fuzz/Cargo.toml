[package]
name = "celerrate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
celerrate_source = { path = "../crates/celerrate_source" }
celerrate_syntax = { path = "../crates/celerrate_syntax" }
celerrate_phpdoc_bridge = { path = "../crates/celerrate_phpdoc_bridge" }
celerrate_plugin = { path = "../crates/celerrate_plugin" }
arbitrary = { version = "1", features = ["derive"] }
celerrate_edit = { path = "../crates/celerrate_edit" }

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docblock"
path = "fuzz_targets/docblock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_apply"
path = "fuzz_targets/edit_apply.rs"
test = false
doc = false
bench = false

# The fuzz harness is its own workspace, separate from the root one.
[workspace]
