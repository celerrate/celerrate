[licenses]
# Zlib (foldhash) arrives with the salsa dependency tree; Unicode-3.0
# (unicode-ident, via proc-macro2) was already in the tree through the
# dev-dependency proc-macro stack. Both are permissive and OSI-approved.
allow = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0"]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
