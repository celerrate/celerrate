[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["JDevelop"]
repository = "https://github.com/celerrate/celerrate"

[workspace.dependencies]
annotate-snippets = "0.12"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
insta = { version = "1", features = ["glob"] }
notify = "8"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1"
rowan = "0.16"
salsa = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal_size = "0.4"
text-size = "1"
toml_edit = "0.23"
trybuild = "1"
ungrammar = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
strip = "symbols"
