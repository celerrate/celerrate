name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide whether the change touches anything the build, tests, lints or
  # corpus depend on. Everything counts as code except a small allowlist of
  # inert documentation files, so a misclassification can only run the full
  # suite unnecessarily, never skip it on a real code change. Every job below
  # carries a required branch-protection context, so none of them may skip at
  # the job level: a skipped matrix job never expands, its per-OS contexts
  # are never reported, and branch protection waits forever (issue #89).
  # Instead the jobs always start and every step gates on `code`; on a
  # documentation-only pull request each job no-ops in seconds and reports
  # success, so auto-merge can fire without manual intervention.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$GITHUB_SHA"
          fi
          # Run the full suite whenever the base is missing or unknown (for
          # example a new branch, whose before-sha is all zeros): never skip
          # on uncertainty.
          valid=true
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            valid=false
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            valid=false
          fi
          if [ "$valid" = false ]; then
            echo "base unavailable; running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" "$head")"
          echo "changed files:"
          printf '%s\n' "$files"
          # A change counts as code unless every changed file is inert
          # documentation. Any other path forces the full suite, so a
          # misclassification can only over-run, never skip a real change.
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|LICENSE*|.gitignore|.gitattributes|.editorconfig) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "resolved code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy, rustfmt
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo fmt --all --check
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo xtask dependency-shape
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo xtask emission-scan

  test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: rustfmt
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ needs.changes.outputs.code == 'true' }}
        # `--include-ignored` runs the watch tests that drive a real
        # filesystem watcher. They cost seconds each waiting on operating
        # system notifications, so they are `#[ignore]`d to keep the local
        # suite fast, and this is the run that still proves them.
        run: cargo test --workspace -- --include-ignored

  deny:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: EmbarkStudios/cargo-deny-action@v2

  stubs:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo clippy --package celerrate_stubs --features compiler --all-targets -- -D warnings
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo xtask compile-stubs --check

  rules-render:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: Swatinem/rust-cache@v2
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo clippy --package celerrate_rules --features render --all-targets -- -D warnings
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo test --package celerrate_rules --features render

  dist:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ needs.changes.outputs.code == 'true' && runner.os == 'Linux' }}
        run: shellcheck install.sh
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}
      - if: ${{ needs.changes.outputs.code == 'true' && contains(matrix.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: cargo xtask dist --target ${{ matrix.target }}
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Check packaging determinism
        run: |
          mkdir determinism
          cp target/dist/celerrate-* determinism/
          rm -r target/dist
          cargo xtask dist --target ${{ matrix.target }}
          for file in determinism/*; do
            cmp "$file" "target/dist/$(basename "$file")"
          done
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Install through install.sh
        run: |
          cat target/dist/*.sha256 > target/dist/SHA256SUMS
          CELERRATE_INSTALL_BASE_URL="file://$PWD/target/dist" sh install.sh --to "$RUNNER_TEMP/celerrate-bin"
          "$RUNNER_TEMP/celerrate-bin/celerrate" --version
      - if: ${{ needs.changes.outputs.code == 'true' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ runner.os == 'Linux' && '7.4' || '8.3' }}
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Composer plugin unit tests
        run: |
          composer install --working-dir packages/composer-bootstrap
          composer test --working-dir packages/composer-bootstrap
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Composer fixture install
        run: |
          php -S 127.0.0.1:8737 -t target/dist &
          for _ in $(seq 1 40); do
            curl -fs http://127.0.0.1:8737/SHA256SUMS >/dev/null 2>&1 && break
            sleep 0.5
          done
          cd packages/composer-bootstrap/tests/fixture
          CELERRATE_DOWNLOAD_BASE_URL="http://127.0.0.1:8737" composer install
          ./vendor/bin/celerrate --version
      - if: ${{ needs.changes.outputs.code == 'true' }}
        name: Refuse a tampered checksum
        # The property this whole slice exists for: a regression that
        # drops `Checksum::matches` from `BinaryInstaller`, or the
        # `|| fail` from install.sh's verification, would leave every
        # step above green while the product installed whatever a
        # server handed it. Both channels must reject a SHA256SUMS
        # whose recorded hash matches nothing real.
        run: |
          refusal="$RUNNER_TEMP/checksum-refusal"
          rm -rf "$refusal"
          mkdir -p "$refusal"
          cp target/dist/celerrate-*.tar.gz "$refusal/" 2>/dev/null || true
          cp target/dist/celerrate-*.zip "$refusal/" 2>/dev/null || true
          zeros="$(printf '0%.0s' $(seq 1 64))"
          : > "$refusal/SHA256SUMS"
          for archive in "$refusal"/celerrate-*; do
            echo "${zeros}  $(basename "$archive")" >> "$refusal/SHA256SUMS"
          done

          echo "expecting install.sh to refuse the tampered checksum"
          if CELERRATE_INSTALL_BASE_URL="file://$refusal" sh install.sh --to "$RUNNER_TEMP/celerrate-refused"; then
            echo "install.sh accepted a tampered checksum" >&2
            exit 1
          fi

          server_pid=""
          cleanup() {
            [ -n "$server_pid" ] && kill "$server_pid" 2>/dev/null
            return 0
          }
          trap cleanup EXIT

          php -S 127.0.0.1:8738 -t "$refusal" &
          server_pid=$!
          for _ in $(seq 1 40); do
            curl -fs http://127.0.0.1:8738/SHA256SUMS >/dev/null 2>&1 && break
            sleep 0.5
          done

          cd packages/composer-bootstrap/tests/fixture
          rm -rf vendor composer.lock
          echo "expecting the Composer fixture to refuse the tampered checksum"
          if CELERRATE_DOWNLOAD_BASE_URL="http://127.0.0.1:8738" composer install; then
            echo "composer install accepted a tampered checksum" >&2
            exit 1
          fi
