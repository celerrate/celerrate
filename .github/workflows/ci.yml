name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide whether the change touches anything the build, tests, lints or
  # corpus depend on. Everything counts as code except a small allowlist of
  # inert documentation files, so a misclassification can only run the full
  # suite unnecessarily, never skip it on a real code change. Downstream jobs
  # gate on `code`; a skipped required job still satisfies branch protection,
  # so a documentation-only pull request stays mergeable without rebuilding.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$GITHUB_SHA"
          fi
          # Run the full suite whenever the base is missing or unknown (for
          # example a new branch, whose before-sha is all zeros): never skip
          # on uncertainty.
          valid=true
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            valid=false
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            valid=false
          fi
          if [ "$valid" = false ]; then
            echo "base unavailable; running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" "$head")"
          echo "changed files:"
          printf '%s\n' "$files"
          # A change counts as code unless every changed file is inert
          # documentation. Any other path forces the full suite, so a
          # misclassification can only over-run, never skip a real change.
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|LICENSE*|.gitignore|.gitattributes|.editorconfig) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "resolved code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask dependency-shape

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  deny:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  stubs:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --package celerrate_stubs --features compiler --all-targets -- -D warnings
      - run: cargo xtask compile-stubs --check
