name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo xtask dist --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: celerrate-${{ matrix.target }}
          path: |
            target/dist/celerrate-*.tar.gz
            target/dist/celerrate-*.zip
            target/dist/celerrate-*.sha256
          if-no-files-found: error

  benchmark-gate:
    runs-on: ubuntu-latest
    # A hung PHPStan run would otherwise hold the runner for GitHub's
    # six-hour default. The budget covers a cold Cargo cache, a cold
    # corpus fetch with its composer install, the release build, and
    # the timed runs themselves.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: target/comparison-corpus
          key: comparison-corpus-${{ hashFiles('xtask/comparison-corpus.pin') }}
      - uses: shivammathur/setup-php@v2
        with:
          # The published protocol (benchmarks/PROTOCOL.md) measured
          # under PHP 8.5.0. Only PHPStan's side of the ratio moves
          # with the interpreter version - Celerrate does not run
          # PHP - and the gate's floor (4.0x, against a measured
          # ~8.01x) leaves enough margin to absorb the difference, so
          # this stays at the runner's readily available version
          # rather than chasing the protocol's exact one.
          php-version: "8.4"
          tools: composer
      - run: sudo apt-get update && sudo apt-get install --yes hyperfine
      - run: cargo xtask benchmark --gate

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, benchmark-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
      - name: Check the tag against the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep --quiet "^version = \"$version\"\$" Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble and verify the checksums
        run: |
          cd artifacts
          cat -- *.sha256 | sort -k 2 > SHA256SUMS
          rm -- *.sha256
          sha256sum --check SHA256SUMS
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/celerrate-*.tar.gz
            artifacts/celerrate-*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask release-notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md artifacts/*

  split-composer:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A GitHub App rather than a deploy key: the organization disables
      # deploy keys, and an app token is owned by the organization, scoped
      # to the single mirror repository below, and expires with the job
      # instead of outliving it in a secret.
      - uses: actions/create-github-app-token@v3
        id: mirror-token
        with:
          app-id: ${{ secrets.COMPOSER_SPLIT_APP_ID }}
          private-key: ${{ secrets.COMPOSER_SPLIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: composer-bootstrap
      - name: Push the package split and its tag to the read-only mirror
        env:
          MIRROR_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          mirror="https://x-access-token:${MIRROR_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/composer-bootstrap.git"
          split="$(git subtree split --prefix packages/composer-bootstrap HEAD)"
          git push --force "$mirror" "${split}:refs/heads/main"
          git push --force "$mirror" "${split}:refs/tags/${GITHUB_REF_NAME}"
