name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --package celerrate_cli --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: |
          archive="celerrate-${{ matrix.target }}"
          mkdir "$archive"
          cp "target/${{ matrix.target }}/release/celerrate" LICENSE-MIT LICENSE-APACHE README.md "$archive/"
          tar --create --gzip --file "$archive.tar.gz" "$archive"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "celerrate-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $archive
          Copy-Item "target/${{ matrix.target }}/release/celerrate.exe", "LICENSE-MIT", "LICENSE-APACHE", "README.md" -Destination $archive
          Compress-Archive -Path $archive -DestinationPath "$archive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: celerrate-${{ matrix.target }}
          path: |
            celerrate-*.tar.gz
            celerrate-*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94"
      - name: Check the tag against the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep --quiet "^version = \"$version\"\$" Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble the checksums
        run: cd artifacts && sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask release-notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md artifacts/*
