<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 132" width="720" height="132" role="img" aria-labelledby="benchmark-title">
  <title id="benchmark-title">Median wall clock of full celerrate check runs on symfony/demo (9447 PHP files, 1.3 million lines), type inference active: cold full analysis 1.496 seconds, warm with one function body edited 0.444 seconds.</title>
